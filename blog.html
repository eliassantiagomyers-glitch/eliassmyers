  <script src="posts.js"></script>
  <script>
    const container = document.getElementById('all-posts');
    POSTS.forEach(p => {
      container.innerHTML += `
      <li>
        <span class="post-date">${p.date}</span>
        <span class="post-title">
          <a href="posts/${p.slug}.html">${p.title}</a>
          <div class="post-excerpt">${p.excerpt}</div>
        </span>
      </li>`;
    });
  </script>
