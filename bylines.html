<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bylines &mdash; Elias S. Myers</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="wrap">

    <header id="site-header">
      <h1>Elias S. Myers</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="bylines.html" class="active">Bylines</a>
        <a href="blog.html">Blog</a>
        <a href="about.html">About</a>
      </nav>
    </header>

    <h2>Bylines</h2>
    <p style="font-size:0.88rem;color:#555;font-family:Arial,Helvetica,sans-serif;">Published work in external outlets.
    </p>

    <ul class="byline-list" id="all-bylines">
    </ul>

    <footer id="site-footer">
      &copy; Elias S. Myers &mdash;
      <a href="mailto:eliassantiagomyers@berkeley.edu">eliassantiagomyers@berkeley.edu</a>
    </footer>

  </div>

  <script src="bylines.js"></script>
  <script>
    const container = document.getElementById('all-bylines');
    if (BYLINES.length === 0) {
      container.innerHTML = '<li style="color:#555;font-size:0.88rem;font-family:Arial,sans-serif;padding:0.5rem 0;">No bylines yet &mdash; check back soon.</li>';
    } else {
      BYLINES.forEach(b => {
        container.innerHTML += `
        <li>
          <span class="byline-pub">${b.publication}</span>
          <span class="byline-title">
            <a href="${b.url}" target="_blank">${b.title}</a>
            ${b.date ? `<span style="color:#888;font-size:0.8rem;font-family:Arial,sans-serif;margin-left:0.5rem;">${b.date}</span>` : ''}
          </span>
        </li>`;
      });
    }
  </script>
</body>

</html>
